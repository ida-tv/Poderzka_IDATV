<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto bg-white p-6 rounded-3xl shadow-xl">
        <h2 class="text-xl font-bold mb-4">Диагностика бота</h2>
        <button onclick="debugBot()" class="w-full bg-red-600 text-white py-3 rounded-2xl mb-4">Нажать для проверки связи</button>
        <div id="debugLog" class="text-xs bg-black text-green-400 p-4 h-40 overflow-y-auto"></div>
    </div>

    <script>
        const BOT_TOKEN = '8962279504:AAH2tTlpSx9q1OLsPpBcsVLyRZfHepLNITQ';
        
        function debugBot() {
            const log = document.getElementById('debugLog');
            log.innerHTML = "Запрос к Telegram...";
            fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/getUpdates")
            .then(r => r.json())
            .then(data => {
                log.innerHTML = JSON.stringify(data, null, 2);
                console.log("Данные от Telegram:", data);
            })
            .catch(err => log.innerHTML = "Ошибка: " + err);
        }
    </script>
</body>
</html>
